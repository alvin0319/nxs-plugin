name: Nightly

on:
  push:
    branches: [ main ]

jobs:
  build:
    uses: ./.github/workflows/build-phar.yml
    with:
      php-version: '8.4'

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: axolotl-pm/pmmp-plugin-actions/publish-nightly@main
        with:
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          plugin-name: ${{ needs.build.outputs.plugin-name }}-*
          plugin-version: ${{ needs.build.outputs.plugin-version }}
          pm-version: ${{ needs.build.outputs.pm-version }}
