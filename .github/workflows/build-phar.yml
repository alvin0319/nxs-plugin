name: Build Phar

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version to set up
        required: true
        type: string
      attest:
        description: Whether to generate a SLSA build provenance attestation for the phars
        required: false
        default: false
        type: boolean
      retention-days:
        description: Days to retain the uploaded artifact
        required: false
        default: '1'
        type: string

    outputs:
      plugin-name:
        description: Value of the name field in plugin.yml
        value: ${{ jobs.build.outputs.plugin-name }}
      plugin-version:
        description: Value of the version field in plugin.yml
        value: ${{ jobs.build.outputs.plugin-version }}
      pm-version:
        description: PocketMine-MP API version(s) from plugin.yml
        value: ${{ jobs.build.outputs.pm-version }}
      artifact-id:
        description: ID of the uploaded artifact holding one phar per platform, named <plugin-name>-<os>-<arch>.phar
        value: ${{ jobs.build.outputs.artifact-id }}

env:
  PHARYNX_VERSION: 0.3.8

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      plugin-name: ${{ steps.plugin-info.outputs.PLUGIN_NAME }}
      plugin-version: ${{ steps.plugin-info.outputs.PLUGIN_VERSION }}
      pm-version: ${{ steps.plugin-info.outputs.PM_VERSION }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Set up PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: ${{ inputs.php-version }}
          install-path: ./bin

      - name: Get plugin info
        id: plugin-info
        run: |
          PM_VERSION=$(php -r "
            \$api = yaml_parse_file('plugin.yml')['api'];
            echo is_array(\$api) ? implode(', ', \$api) : \$api;
          ")
          PLUGIN_VERSION=$(php -r "echo yaml_parse_file('plugin.yml')['version'];")
          PLUGIN_NAME=$(php -r "echo yaml_parse_file('plugin.yml')['name'];")
          echo "PM_VERSION=$PM_VERSION"         >> $GITHUB_OUTPUT
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> $GITHUB_OUTPUT
          echo "PLUGIN_NAME=$PLUGIN_NAME"       >> $GITHUB_OUTPUT

      - name: Build a phar for each platform
        env:
          CGO_ENABLED: '0'
          PLUGIN_NAME: ${{ steps.plugin-info.outputs.PLUGIN_NAME }}
        run: |
          set -e
          curl -fsSL -o "$RUNNER_TEMP/pharynx.phar" "https://github.com/SOF3/pharynx/releases/download/$PHARYNX_VERSION/pharynx.phar"
          mkdir -p "$RUNNER_TEMP/phars"
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            platform="$os-$arch"
            exe=""
            if [ "$os" = windows ]; then
              platform="win-$arch"
              exe=".exe"
            fi
            stage="$RUNNER_TEMP/stage/$platform"
            mkdir -p "$stage"
            cp -r plugin.yml src resources "$stage/"
            (cd bridge && GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$stage/resources/bridge-$platform$exe" .)
            phar="$RUNNER_TEMP/phars/$PLUGIN_NAME-$platform.phar"
            php -dphar.readonly=0 "$RUNNER_TEMP/pharynx.phar" -i "$stage" -p="$phar"
            php -dphar.readonly=0 -r '$phar = new Phar($argv[1]); $phar->compressFiles(Phar::GZ);' "$phar"
          done
          ls -la "$RUNNER_TEMP/phars"

      - name: Generate artifact attestation
        if: inputs.attest
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/phars/*.phar

      - name: Upload phar artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plugin-info.outputs.PLUGIN_NAME }}-phars
          path: ${{ runner.temp }}/phars/*.phar
          retention-days: ${{ inputs.retention-days }}
